<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Monopoly-style official pointing (Go To Investigation) -->
  <!-- body -->
  <path d="M22 54c1-14 5-22 10-22s9 8 10 22" fill="#2b5ea8" stroke="#1a1a1a" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- collar -->
  <path d="M29 34h6l-3 5z" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="32" cy="24" r="8" fill="#f3e7d8" stroke="#1a1a1a" stroke-width="2"/>
  <!-- peaked cap -->
  <path d="M22 20h20l-2 5H24z" fill="#1e3a6e" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M20 20h24" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="29" y="21" width="6" height="2.5" rx="0.5" fill="#f5c542" stroke="#1a1a1a" stroke-width="1"/>
  <!-- mustache -->
  <path d="M28 28c2 2 6 2 8 0" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- pointing arm -->
  <path d="M40 36l16-2" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M40 36c4-1 10-1 14-1" stroke="#2b5ea8" stroke-width="5" stroke-linecap="round"/>
  <path d="M54 33v5M56 32.5v4" stroke="#f3e7d8" stroke-width="2" stroke-linecap="round"/>
  <!-- other arm akimbo -->
  <path d="M24 38c-4 2-5 6-4 10" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M24 38c-3 2-4 5-3 8" stroke="#2b5ea8" stroke-width="4.5" stroke-linecap="round"/>
</svg>
